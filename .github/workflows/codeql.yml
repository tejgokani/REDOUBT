name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - run: make scanner
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4
        with:
          category: "/language:c-cpp"
