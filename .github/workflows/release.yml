name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check tag == REDOUBT_VERSION
        run: |
          v=$(grep -oP '#define REDOUBT_VERSION "\K[^"]+' scanner/main.c)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: make scanner test HARDEN=1

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build hardened scanner
        run: make scanner test HARDEN=1
      - name: Package
        run: |
          d=redoubt-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}
          mkdir $d
          cp build/redoubt LICENSE README.md $d/
          cp -r docs $d/docs
          tar czf $d.tar.gz $d
          sha256sum $d.tar.gz > $d.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.arch }}
          path: redoubt-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Source tarball
        run: git archive --format=tar.gz --prefix=redoubt-${GITHUB_REF_NAME}/ -o dist/redoubt-${GITHUB_REF_NAME}-src.tar.gz HEAD
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/*.tar.gz"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag --title "Redoubt ${GITHUB_REF_NAME}"
