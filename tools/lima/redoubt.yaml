# Lima VM for Redoubt development. Use tools/vm-up.sh (it substitutes REPO_DIR).
# Ubuntu 24.04 aarch64 (kernel 6.8) - the pinned dev target.
vmType: "qemu"
arch: "aarch64"
cpus: 4
memory: "4GiB"
disk: "30GiB"
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts:
  - location: "REPO_DIR"
    mountPoint: "/redoubt"
    writable: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        build-essential make kmod linux-headers-$(uname -r) gdb git
